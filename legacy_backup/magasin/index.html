    <style>
        :root {
            /* --- Neo-Brutalism Palette --- */
            --bg-color: #ffffff;
            --text-main: #000000;
            
            /* 核心色 */
            --c-yellow: #FFE66D;
            --c-pink: #FF6B6B;
            --c-cyan: #4ECDC4;
            --c-purple: #9b5de5;
            --c-green: #00f5d4;

            --border-width: 3px;
            --shadow-hard: 8px 8px 0px #000000;
            --shadow-hover: 4px 4px 0px #000000;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 100px;
        }

        body {
            font-family: 'Space Grotesk', 'Noto Sans SC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            /* 点阵背景 */
            background-image: radial-gradient(#000 2px, transparent 2px);
            background-size: 40px 40px;
        }

        :lang(ar) body { font-family: 'Cairo', sans-serif; }

        /* --- 几何装饰 --- */
        .geo-shape {
            position: absolute;
            border: var(--border-width) solid black;
            z-index: -1;
            animation: float 6s ease-in-out infinite;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
        }
        
        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-10px, -15px) rotate(5deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* --- 跑马灯 --- */
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .marquee-container {
            overflow: hidden;
            white-space: nowrap;
            background: #000;
            color: #fff;
            border-top: var(--border-width) solid black;
            border-bottom: var(--border-width) solid black;
            transform: rotate(-1deg);
            width: 105%;
            margin-left: -2.5%;
            margin-bottom: 4rem;
            position: relative;
            z-index: 10;
        }
        .marquee-content {
            display: inline-block;
            animation: marquee 30s linear infinite;
            padding: 12px 0;
            font-weight: 900;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* --- 组件样式 --- */
        .neo-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: var(--border-width) solid black;
            background: white;
            box-shadow: 4px 4px 0px black;
            font-weight: 700;
            transition: all 0.15s;
            cursor: pointer;
        }
        .neo-btn:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px black;
        }
        .neo-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px black;
        }
        .neo-btn.active {
            background: black;
            color: white;
        }

        .neo-card {
            background: white;
            border: var(--border-width) solid black;
            box-shadow: var(--shadow-hard);
            transition: all 0.2s;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
        }
        .neo-card:hover {
            transform: translate(4px, 4px);
            box-shadow: var(--shadow-hover);
        }

        /* 商店条目样式 */
        .shop-item {
            border-bottom: 2px dashed #e5e7eb;
            padding: 0.75rem 0;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            transition: background 0.2s;
        }
        .shop-item:last-child { border-bottom: none; }
        .shop-item:hover { background: #f9fafb; padding-left: 0.5rem; padding-right: 0.5rem; }

        /* 对话气泡 */
        .bubble {
            background: white;
            border: 2px solid black;
            padding: 1rem;
            position: relative;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
            margin-bottom: 1rem;
        }
        .bubble::after {
            content: '';
            position: absolute;
            border-style: solid;
            border-width: 10px 10px 0;
            border-color: black transparent transparent transparent;
            bottom: -10px;
            left: 20px;
        }
        .bubble.alt {
            background: var(--c-cyan);
        }
        .bubble.alt::after {
            left: auto;
            right: 20px;
            border-color: black transparent transparent transparent;
        }

        /* 标题标签 */
        .section-tag {
            display: inline-block;
            background: black;
            color: white;
            padding: 0.5rem 1.5rem;
            font-weight: 900;
            transform: skew(-10deg);
            margin-bottom: 1rem;
        }

        /* Header */
        header {
            background: rgba(255, 255, 255, 0.95);
            border-bottom: var(--border-width) solid black;
            backdrop-filter: blur(5px);
        }

        /* Back to Top */
        #back-to-top {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--c-cyan);
            color: black;
            border: 3px solid black;
            padding: 0.8rem;
            box-shadow: 4px 4px 0px black;
            z-index: 50;
            display: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        #back-to-top:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px black;
            background: var(--c-pink);
            color: white;
        }
        
        /* Animation Defaults */
        .animate-on-scroll {
            opacity: 1; /* Ensure visible by default for robustness */
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .scroll-hidden {
            opacity: 0;
            transform: translateY(40px);
        }
        
        /* Tooltip/Note Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: white;
            border: 4px solid black;
            box-shadow: 10px 10px 0px black;
            padding: 2rem;
            max-width: 400px;
            width: 90%;
            transform: scale(0.9);
            transition: transform 0.3s;
        }
        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

    </style>
</head>

                    { fr: "Vous avez d'autres couleurs ?", trans: { zh: "有别的颜色吗？", en: "Do you have other colors?", es: "¿Tiene otros colores?" } }
                ]
            },
            {
                title: { zh: "结账与告别", en: "Payment & Goodbye", es: "Pago y Despedida" },
                lines: [
                    { fr: "Je peux payer par carte ?", trans: { zh: "可以刷卡吗？", en: "Can I pay by card?", es: "¿Puedo pagar con tarjeta?" } },
                    { fr: "Merci, bonne journée !", trans: { zh: "谢谢，祝您愉快！", en: "Thank you, have a good day!", es: "¡Gracias, que tenga un buen día!" } }
                ]
            }
        ];

        const quizDataSets = [
             [
                { q: { zh: "买药去哪里？", en: "Where to buy medicine?", es: "¿Dónde comprar medicina?" }, a: "Pharmacie", ops: ["Boulangerie", "Pharmacie", "Librairie", "Gare"] },
                { q: { zh: "买面包去哪里？", en: "Where to buy bread?", es: "¿Dónde comprar pan?" }, a: "Boulangerie", ops: ["Boucherie", "Boulangerie", "Poste", "Tabac"] },
                { q: { zh: "'Librairie' 是什么意思？", en: "What is 'Librairie'?", es: "¿Qué es 'Librairie'?" }, a: "Bookshop", ops: { zh:["图书馆", "书店", "文具店"], en:["Library", "Bookshop", "Stationery"], es:["Biblioteca", "Librería", "Papelería"] } },
                { q: { zh: "买肉去哪里？", en: "Where to buy meat?", es: "¿Dónde comprar carne?" }, a: "Boucherie", ops: ["Boucherie", "Fleuriste", "Épicerie", "Parfumerie"] }
            ],
            [
                { q: { zh: "买花去哪里？", en: "Where to buy flowers?", es: "¿Dónde comprar flores?" }, a: "Fleuriste", ops: ["Fleuriste", "Tabac", "Banque", "Marché"] },
                { q: { zh: "买邮票去哪里？", en: "Where to buy stamps?", es: "¿Dónde comprar sellos?" }, a: "Tabac", ops: ["Tabac", "Boutique", "Pharmacie", "Cinema"] },
                { q: { zh: "'Je voudrais...' 意思是？", en: "Meaning of 'Je voudrais...'?", es: "¿Significado de 'Je voudrais...'?" }, a: "I would like", ops: { zh:["我看...", "我想要...", "我有..."], en:["I see...", "I would like...", "I have..."], es:["Veo...", "Quisiera...", "Tengo..."] } }
            ]
        ];

        let currentLang = 'zh';
        let currentQuizIndex = 0;

        // --- Functions ---

        function renderShops() {
            const container = document.getElementById('shops-container');
            container.innerHTML = '';
            shopData.forEach((cat, index) => {
                const card = document.createElement('div');
                card.className = 'neo-card bg-white animate-on-scroll';
                card.style.animationDelay = `${index * 0.1}s`;
                
                // Header
                const header = document.createElement('div');
                header.className = 'p-4 border-b-2 border-black flex items-center gap-3';
                header.style.backgroundColor = cat.color;
                header.innerHTML = `<i class="ph-duotone ${cat.icon} text-2xl"></i><h3 class="font-black text-lg uppercase">${cat.category[currentLang]}</h3>`;
                card.appendChild(header);

                // List
                const list = document.createElement('div');
                list.className = 'p-6 flex flex-col';
                cat.items.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'shop-item';
                    
                    let noteHtml = '';
                    if(item.note && item.note[currentLang]) {
                        noteHtml = `<button class="ml-2 text-[var(--c-purple)] hover:text-black transition-colors tooltip-btn" data-note="${item.note[currentLang]}"><i class="ph-bold ph-info"></i></button>`;
                    }

                    row.innerHTML = `
                        <span class="font-black text-lg">${item.fr}</span>
                        <div class="flex items-center">
                            <span class="text-sm font-bold text-gray-500">${item.trans[currentLang]}</span>
                            ${noteHtml}
                        </div>
                    `;
                    list.appendChild(row);
                });
                card.appendChild(list);
                container.appendChild(card);
            });
        }

        function renderTemplates() {
            const container = document.getElementById('templates-container');
            container.innerHTML = '';
            templateData.forEach((tpl, index) => {
                const group = document.createElement('div');
                group.className = 'animate-on-scroll';
                group.innerHTML = `<h3 class="text-2xl font-black mb-6 text-white text-stroke-black" style="-webkit-text-stroke: 1px black;">${tpl.title[currentLang]}</h3>`;
                
                const grid = document.createElement('div');
                grid.className = 'grid md:grid-cols-2 gap-6';
                
                tpl.lines.forEach((line, i) => {
                    const bubble = document.createElement('div');
                    bubble.className = `bubble ${i % 2 !== 0 ? 'alt' : ''}`;
                    bubble.innerHTML = `
                        <p class="font-black text-lg mb-1">${line.fr}</p>
                        <p class="text-sm font-bold text-gray-600">${line.trans[currentLang]}</p>
                    `;
                    grid.appendChild(bubble);
                });
                
                group.appendChild(grid);
                container.appendChild(group);
            });
        }

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            const resultDiv = document.getElementById('quiz-results');
            container.innerHTML = '';
            resultDiv.textContent = '';
            document.getElementById('submit-quiz').style.display = 'inline-block';

            const currentSet = quizDataSets[currentQuizIndex];
            
            currentSet.forEach((q, i) => {
                const item = document.createElement('div');
                item.className = 'border-2 border-black p-4 bg-gray-50 quiz-item';
                
                const question = document.createElement('p');
                question.className = 'font-black text-lg mb-4';
                question.textContent = `${i+1}. ${q.q[currentLang]}`;
                item.appendChild(question);

                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'grid grid-cols-2 gap-3';
                
                // Handle localized options
                const options = Array.isArray(q.ops) ? q.ops : q.ops[currentLang];
                const answer = Array.isArray(q.ops) ? q.a : (q.ops.en ? (q.a === "Bookshop" ? "书店" : q.a) : q.a); // Simplified logic for demo
                // Real logic: align answer key with localized options index if needed, or strictly match string. 
                // For this demo, we'll assume 'a' matches one of the 'ops' or needs simple mapping.
                // Let's make it robust:
                
                options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'quiz-opt neo-btn py-2 bg-white hover:bg-black hover:text-white text-sm font-bold border-black w-full';
                    btn.textContent = opt;
                    btn.dataset.val = opt;
                    btn.onclick = () => {
                        item.querySelectorAll('.quiz-opt').forEach(b => {
                            b.classList.remove('bg-black', 'text-white');
                            b.classList.add('bg-white', 'text-black');
                            b.dataset.selected = 'false';
                        });
                        btn.classList.remove('bg-white', 'text-black');
                        btn.classList.add('bg-black', 'text-white');
                        btn.dataset.selected = 'true';
                    };
                    optionsDiv.appendChild(btn);
                });
                item.appendChild(optionsDiv);
                container.appendChild(item);
            });
        }

        function checkQuiz() {
            const currentSet = quizDataSets[currentQuizIndex];
            let score = 0;
            const items = document.querySelectorAll('.quiz-item');
            
            items.forEach((item, i) => {
                const selectedBtn = item.querySelector('[data-selected="true"]');
                const correctVal = Array.isArray(currentSet[i].ops) ? currentSet[i].a : (currentLang === 'zh' && currentSet[i].a === 'Bookshop' ? '书店' : currentSet[i].a); 
                // Note: Simplified verification. In prod, compare indices.
                
                // Very basic check for demo purposes (string match or index match if mapped)
                // Let's assume correct answer text is known.
                // For "Librairie": ZH ops: ["图书馆", "书店", "文具店"]. Correct: "书店"
                
                let isCorrect = false;
                if (selectedBtn) {
                    // Dynamic check logic adjustment for this specific data structure
                    if (currentSet[i].q.zh.includes("Librairie") && currentLang === 'zh') isCorrect = selectedBtn.textContent === "书店";
                    else if (currentSet[i].q.zh.includes("Librairie") && currentLang === 'es') isCorrect = selectedBtn.textContent === "Librería";
                    else if (currentSet[i].q.zh.includes("Je voudrais") && currentLang === 'zh') isCorrect = selectedBtn.textContent === "我想要...";
                    else if (currentSet[i].q.zh.includes("Je voudrais") && currentLang === 'es') isCorrect = selectedBtn.textContent === "Quisiera...";
                    else isCorrect = selectedBtn.textContent === currentSet[i].a;
                }

                if (isCorrect) {
                    score++;
                    item.classList.add('bg-green-100', 'border-green-500');
                } else {
                    item.classList.add('bg-red-100', 'border-red-500');
                }
                
                // Disable buttons
                item.querySelectorAll('button').forEach(b => b.disabled = true);
            });

            const resultText = translations[currentLang].quiz_result.replace('{score}', score).replace('{total}', currentSet.length);
            document.getElementById('quiz-results').textContent = score === currentSet.length ? resultText + " " + translations[currentLang].quiz_perfect : resultText;
            document.getElementById('submit-quiz').style.display = 'none';
        }

        function updateLanguage(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            
            // Update static text
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.dataset.key;
                if(translations[lang][key]) el.innerHTML = translations[lang][key];
            });

            // Update buttons state
            document.querySelectorAll('.lang-btn').forEach(btn => {
                if(btn.dataset.lang === lang) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            // Re-render dynamic content
            renderShops();
            renderTemplates();
            renderQuiz();
        }

        // --- Event Listeners ---
        document.addEventListener('DOMContentLoaded', () => {
            updateLanguage('zh'); // Init

            // Lang Buttons
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.addEventListener('click', () => updateLanguage(btn.dataset.lang));
            });

            // Mobile Menu
            const menuBtn = document.getElementById('menu-btn');
            const mobileMenu = document.getElementById('mobile-menu');
            menuBtn.addEventListener('click', () => mobileMenu.classList.toggle('hidden'));
            mobileMenu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => mobileMenu.classList.add('hidden')));

            // Quiz Actions
            document.getElementById('submit-quiz').addEventListener('click', checkQuiz);
            document.getElementById('reset-quiz').addEventListener('click', renderQuiz);
            document.getElementById('change-quiz').addEventListener('click', () => {
                currentQuizIndex = (currentQuizIndex + 1) % quizDataSets.length;
                renderQuiz();
            });

            // Modal Logic (Delegation)
            const modal = document.getElementById('note-modal');
            const modalText = document.getElementById('modal-text');
            const closeModal = document.getElementById('close-modal');
            
            document.getElementById('shops-container').addEventListener('click', (e) => {
                const btn = e.target.closest('.tooltip-btn');
                if (btn) {
                    modalText.textContent = btn.dataset.note;
                    modal.classList.add('active');
                }
            });
            
            closeModal.addEventListener('click', () => modal.classList.remove('active'));
            modal.addEventListener('click', (e) => { if(e.target === modal) modal.classList.remove('active'); });

            // Scroll Animations
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.remove('scroll-hidden');
                    }
                });
            }, { threshold: 0.1 });

            // Add hidden class initially to dynamic elements after render? 
            // Or just let CSS handle opacity transition from 0->1 if class not present?
            // To be safe and robust, we just rely on the CSS defaults (opacity: 1) and add .scroll-hidden via JS if needed.
            // For this specific request "fix blank page", I removed default opacity:0 in CSS. 
            // Now we add animation class.
            
            document.querySelectorAll('.animate-on-scroll').forEach(el => {
                el.classList.add('scroll-hidden'); // Hide via JS
                observer.observe(el);
            });
            
            // Back to Top
            const backToTop = document.getElementById('back-to-top');
            window.addEventListener('scroll', () => {
                backToTop.style.display = window.scrollY > 300 ? 'block' : 'none';
            });
            backToTop.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));
        });

    </script>
</body>
</html>
